$umask 0000

module(load="imudp")
module(load="imtcp")

# 1. Inputs assigned to the "syslog-flow" ruleset
input(type="imudp" port="514" ruleset="syslog-flow")
input(type="imtcp" port="514" ruleset="syslog-flow")

# 2. Global Templates (Must be outside the ruleset block)
template(
  name="DeviceLogFile"
  type="string"
  string="/var/log/syslog-flow/%timegenerated:::date-year%/%timegenerated:::date-month%/%timegenerated:::date-day%/%hostname:::secpath-replace%.log"
)

template(
  name="PlainLogLine"
  type="string"
  string="%timegenerated:::date-rfc3339% | %timereported:::date-rfc3339% %hostname% %syslogseverity-text% %syslogtag%%msg:::sp-if-no-1st-sp%%msg%\n"
)

# 3. Ruleset block (Contains actions that execute the templates)
action(
  type="omfile"
  dynaFile="DeviceLogFile"
  template="PlainLogLine"
  createDirs="on"
  dirCreateMode="0755"
  fileCreateMode="0644"
  fileOwner="syslog-flow"
  fileGroup="syslog-flow"
  dirOwner="syslog-flow"
  dirGroup="syslog-flow"
)
