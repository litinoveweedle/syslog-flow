name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach binaries to (uses existing release, or creates one if missing)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ext=".exe"
          fi
          suffix="${{ matrix.goarch }}"
          if [ -n "${GOARM:-}" ]; then
            suffix="${suffix}v${GOARM}"
          fi
          name="syslog-flow-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${suffix}${ext}"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" \
            -o "dist/${name}" ./cmd/syslog-flow
          echo "asset=dist/${name}" >> "$GITHUB_ENV"

      - name: Generate checksum
        run: sha256sum "${asset}" > "${asset}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: |
            dist/*
          retention-days: 7

  package-deb:
    name: Package .deb (${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            artifact: binaries-linux-amd64
          - arch: arm64
            artifact: binaries-linux-arm64
          - arch: armhf
            artifact: binaries-linux-armv7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.event.release.tag_name }}"
          fi
          echo "version=${tag}" >> "$GITHUB_OUTPUT"
          echo "debversion=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Stage binary for packaging
        run: |
          set -euo pipefail
          bin=$(find dist -maxdepth 1 -type f -name 'syslog-flow-*' ! -name '*.sha256' | head -n1)
          mv "$bin" dist/syslog-flow
          chmod 755 dist/syslog-flow

      - name: Build .deb
        env:
          NFPM_VERSION: ${{ steps.version.outputs.debversion }}
          NFPM_ARCH: ${{ matrix.arch }}
        run: |
          nfpm package \
            --config packaging/nfpm.yaml \
            --packager deb \
            --target "dist/syslog-flow_${{ steps.version.outputs.version }}_${{ matrix.arch }}.deb"

      - name: Generate checksum
        run: |
          cd dist
          sha256sum "syslog-flow_${{ steps.version.outputs.version }}_${{ matrix.arch }}.deb" \
            > "syslog-flow_${{ steps.version.outputs.version }}_${{ matrix.arch }}.deb.sha256"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
          retention-days: 7

  release:
    name: Publish release assets
    needs: [build, package-deb]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
